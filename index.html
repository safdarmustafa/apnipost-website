<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ApniPost helps you create personalized status posts, birthday videos, and ringtones — then share them on WhatsApp with your photo and name."
    />
    <meta name="theme-color" content="#0f3d9d" />

    <!-- Open Graph / WhatsApp / Facebook share preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ApniPost" />
    <meta property="og:title" content="ApniPost — Share content your way" />
    <meta
      property="og:description"
      content="ApniPost helps you create personalized status posts, birthday videos, and ringtones — then share them on WhatsApp with your photo and name."
    />
    <meta property="og:url" content="https://apnipost.com/" />
    <meta property="og:image" content="https://apnipost.com/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ApniPost logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ApniPost — Share content your way" />
    <meta
      name="twitter:description"
      content="ApniPost helps you create personalized status posts, birthday videos, and ringtones — then share them on WhatsApp with your photo and name."
    />
    <meta name="twitter:image" content="https://apnipost.com/brand/og-image.png" />

    <link rel="canonical" href="https://apnipost.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ApniPost — Share content your way</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
